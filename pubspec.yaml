name: eco_student
description: EcoStudent — reverse-vending rewards for Algerian university campuses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  phosphor_flutter: ^2.1.0
  mobile_scanner: ^6.0.2
  intl: ^0.20.2
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  path_provider: ^2.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: assets/images/logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
